<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BBCaster</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #ebebeb;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 {
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      font-weight: 700;
      font-style: italic;
      color: #59c3c3;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    #qrBtn {
      padding: 0.4rem 0.9rem;
      background: transparent;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    #qrBtn:hover {
      background: #fff;
      color: #1a1a2e;
      border-color: #59c3c3;
    }

    #qrBtn:active {
      transform: scale(0.95);
    }
    .logo-icon {
      font-size: 2.5rem;
      color: #fff;
      filter: drop-shadow(0 0 8px rgba(90, 195, 195, 0.6));
    }
    .logo-text {
      font-size: 1.8rem;
      font-weight: 700;
      font-style: italic;
      color: #59c3c3;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .show-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #ebebeb;
      font-size: 1rem;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      padding: 1.25rem .5rem;
      border-radius: 8px;
      border: 3px solid #fff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      height: 44px;
    }

    .show-label:hover {
      background: #52489c;
      border-color: #59c3c3;
      box-shadow: 0 0 20px rgba(90, 195, 195, 0.5);
    }

    .show-symbol {
      font-size: 1.4rem;
      font-weight: bold;
      line-height: 1;
      width: 24px;
      text-align: center;
      display: inline-block;
    }

    .show-label input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    #msgInput {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 2px solid #333;
      border-radius: 8px;
      background: #ebebeb;
      color: #1a1a2e;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #msgInput:focus { border-color: #59c3c3; }
    button {
      padding: 0.75rem 1.5rem;
      background: #52489c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4062bb; }
    .messages {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    pre {
      background: #52489c;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      color: #ebebeb;
      position: relative;
      overflow-x: auto;
      transition: opacity 0.5s, transform 0.5s;
    }
    pre.expiring {
      border-color: #f45b69;
      color: #f45b69;
    }
    .timer {
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 0.75rem;
      color: #ebebeb;
    }
    @keyframes flash {
      0%   { background: #52489c; }
      50%  { background: #f45b69; }
      100% { background: #52489c; }
    }
    pre.flashing {
      animation: flash 0.2s ease-out;
    }
    .empty {
      text-align: center;
      color: #666;
      padding: 2rem;
      font-style: italic;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1a1a2e;
      border: 2px solid #59c3c3;
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      position: relative;
      box-shadow: 0 0 30px rgba(90, 195, 195, 0.3);
    }

    .modal-close {
      position: absolute;
      top: 0.5rem;
      right: 1rem;
      font-size: 1.5rem;
      color: #ebebeb;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: #f45b69;
    }

    #qrCanvas canvas {
      border-radius: 8px;
      background-color: #fff;
      padding: 0.7rem;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-icon">🛰️</span>
    <span class="logo-text">BBCaster</span>
    <button id="qrBtn">QR</button>
  </div>

  <div class="controls">
    <label class="show-label">
      <input type="checkbox" id="showCheck" checked />
      <span class="show-symbol">⚆</span>
    </label>
    <input type="text" id="msgInput" placeholder="Escribí un mensaje..." />
    <button id="sendBtn">Enviar</button>
  </div>

  <!-- Modal -->
  <div id="qrModal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2 style="text-align:center; margin-bottom:1rem; color:#59c3c3;">Escaneá este QR</h2>
      <div id="qrCanvas" style="display:flex; justify-content:center;"></div>
      <p id="qrUrl" style="text-align:center; margin-top:1rem; font-size:0.8rem; color:#999; word-break:break-all;"></p>
    </div>
  </div>

  <div class="messages" id="messagesContainer">
    <p class="empty">Esperando mensajes...</p>
  </div>

  <script src="/public/qrcode.min.js"></script>
  <script>
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const container = document.getElementById('messagesContainer');

    // QR Modal
    const qrBtn = document.getElementById('qrBtn');
    const qrModal = document.getElementById('qrModal');
    const qrCanvas = document.getElementById('qrCanvas');
    const qrUrl = document.getElementById('qrUrl');
    const modalClose = document.querySelector('.modal-close');

    function openQrModal() {
      const url = window.location.origin;
      qrCanvas.innerHTML = '';
      new QRCode(qrCanvas, { text: url, width: 200, height: 200 });
      qrUrl.textContent = url;
      qrModal.classList.add('active');
    }

    function closeQrModal() {
      qrModal.classList.remove('active');
    }

    qrBtn.addEventListener('click', openQrModal);
    modalClose.addEventListener('click', closeQrModal);
    qrModal.addEventListener('click', (e) => {
      if (e.target === qrModal) closeQrModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeQrModal();
    });

    // Send message via POST
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      try {
        await fetch('/post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ txt: text, show: showCheck.checked })
        });
        input.value = '';
      } catch (e) {
        console.error('Error sending:', e);
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Toggle input type and symbol based on checkbox state
    showCheck.addEventListener('change', () => {
      input.type = showCheck.checked ? 'text' : 'password';
      document.querySelector('.show-symbol').textContent = showCheck.checked ? '⚆' : '◠';
    });

    // Global debounce for all buttons (1s cooldown)
    const BUTTONS = document.querySelectorAll('button, .show-label');
    BUTTONS.forEach(btn => {
      let copied = false;
      btn.addEventListener('click', () => {
        if (copied) return;
        copied = true;
        btn.style.opacity = '0.5';
        setTimeout(() => {
          btn.style.opacity = '1';
          copied = false;
        }, 1000);
      });
    });

    // Receive SSE events
    const eventSource = new EventSource('/events');

    eventSource.onmessage = (event) => {
      if (event.event === 'connected') return;
      const msg = JSON.parse(event.data);
      addMessage(msg.txt, msg.show, msg.ts);
    };

    eventSource.onerror = () => {
      console.warn('SSE connection lost, reconnecting...');
      // No close() — let the browser's built-in retry mechanism handle reconnection
      // The EventSource will automatically retry every ~3 seconds
    };

    // Add message to UI with 15s lifetime
    function addMessage(txt, show, ts) {
      // Remove empty placeholder if present
      const empty = container.querySelector('.empty');
      if (empty) empty.remove();

      const pre = document.createElement('pre');
      pre.style.cursor = 'pointer';
      pre.title = 'Click para copiar';

      const timer = document.createElement('span');
      timer.className = 'timer';
      timer.textContent = '15s';

      // Store real text for copy
      pre.dataset.realText = txt;

      // Store timestamp for display
      pre.dataset.ts = ts;

      let displayText;
      if (show) {
        displayText = txt;
      } else {
        displayText = '*'.repeat(txt.length);
      }

      const content = document.createTextNode(displayText);

      pre.appendChild(timer);
      pre.appendChild(content);

      // Insert new messages at the top
      if (container.firstChild) {
        container.insertBefore(pre, container.firstChild);
      } else {
        container.appendChild(pre);
      }

      // Remove old messages if more than 50
      while (container.children.length > 50) {
        container.firstChild.remove();
      }

      // Countdown and remove after 15 seconds
      let secondsLeft = 15;
      const interval = setInterval(() => {
        secondsLeft--;
        timer.textContent = `${secondsLeft}s`;
        if (secondsLeft <= 3) pre.classList.add('expiring');
        if (secondsLeft <= 0) {
          clearInterval(interval);
          pre.style.opacity = '0';
          setTimeout(() => pre.remove(), 500);
        }
      }, 1000);

      // Click to copy real content to clipboard (regardless of show state)
      // Debounce: disable clicks for 1s after a successful copy
      let copied = false;
      pre.addEventListener('click', () => {
        if (copied) return;
        copied = true;
        pre.classList.add('flashing');
        navigator.clipboard.writeText(pre.dataset.realText).then(() => {
          timer.textContent = '✓ Copiado';
          setTimeout(() => pre.classList.remove('flashing'), 200);
          setTimeout(() => { timer.textContent = `${secondsLeft}s`; }, 1500);
        }).finally(() => {
          setTimeout(() => { copied = false; }, 1000);
        });
      });
    }
  </script>
</body>
</html>
